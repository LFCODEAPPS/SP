<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El baúl de fernando</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-950 text-white font-sans antialiased min-h-screen flex flex-col justify-between">

    <!-- Header & Buscador -->
    <header class="bg-zinc-900/80 backdrop-blur-md border-b border-zinc-800 sticky top-0 z-50 px-6 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
        <div class="flex items-center gap-3">
            <h1 class="text-xl md:text-2xl font-black tracking-wider text-red-600">EL BAÚL DE <span class="text-white">FERNANDO</span></h1>
            <span class="text-[10px] bg-emerald-600 text-white px-2 py-0.5 rounded font-semibold uppercase">Legal & TMDB</span>
        </div>

        <!-- Buscador -->
        <div class="w-full md:w-96">
            <input type="text" id="searchInput" placeholder="Busca películas, series..." class="w-full bg-zinc-800 border border-zinc-700 px-4 py-2 rounded-lg text-sm focus:outline-none focus:border-red-600 transition">
        </div>

        <!-- Botón de Configuración de API Key -->
        <div class="relative">
            <button id="configBtn" class="bg-zinc-800 hover:bg-zinc-700 border border-zinc-700 px-3 py-2 rounded-lg text-xs font-semibold flex items-center gap-2 transition">
                ⚙️ Configurar API Key
            </button>
            
            <!-- Menú desplegable oculto de configuración -->
            <div id="configMenu" class="hidden absolute right-0 mt-2 w-72 bg-zinc-900 border border-zinc-800 rounded-xl p-4 shadow-2xl z-50 space-y-3">
                <p class="text-xs text-zinc-400">Ingresa tu TMDB API Key para habilitar el catálogo:</p>
                <input type="password" id="apiKeyInput" placeholder="Pega tu API Key aquí..." class="w-full bg-zinc-800 border border-zinc-700 px-3 py-2 rounded-lg text-xs focus:outline-none focus:border-red-600">
                <button id="saveApiKeyBtn" class="w-full bg-red-600 hover:bg-red-700 text-xs font-bold py-2 rounded-lg transition">Guardar Cambios</button>
            </div>
        </div>
    </header>

    <!-- Contenido Principal -->
    <main class="container mx-auto px-6 py-8 flex-grow">
        <section>
            <h2 id="sectionTitle" class="text-xl font-bold mb-6 text-zinc-200 border-l-4 border-red-600 pl-3">Tendencias Populares</h2>
            <div id="moviesGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-6">
                <!-- Las tarjetas se inyectarán aquí -->
            </div>
        </section>
    </main>

    <!-- Modal de Detalles, Trailer y Calificación por Episodios -->
    <div id="detailModal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex justify-center items-center p-4">
        <div class="bg-zinc-900 border border-zinc-800 w-full max-w-4xl rounded-xl overflow-hidden relative shadow-2xl flex flex-col max-h-[90vh]">
            <button id="closeModal" class="absolute top-4 right-4 text-zinc-400 hover:text-white text-2xl font-bold z-10 bg-zinc-950/60 w-8 h-8 rounded-full flex items-center justify-center">&times;</button>
            <div id="modalBody" class="overflow-y-auto p-6 space-y-6"></div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="border-t border-zinc-900 bg-zinc-950 py-6 text-center text-xs text-zinc-500">
        El baúl de fernando — Desarrollado con la API de TMDB.
    </footer>

    <script src="app.js"></script>
</body>
</html>
